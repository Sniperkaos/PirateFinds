properties:
   version-number: 1.01

options:
   auto-update: true
   debug-mode: false

warnings:
   suppress_all_warnings: true

login:
   login_message: "&7Welcome back, %player_name%!"

first-join:
   first-join-message: 
     - "&f-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=--=-"
     - "&a&lPlease welcome %player_name% to the server!" #this works with placeholders
     - "&f-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=--=-"
   first-join-commands: # Also uses placeholders parsed with the joining player
     - 'crate key giveall common 1'
     - 'crate key give %player_name% legendary 1'

command-remove: # put commands here to disable them from being used. Like arena commands, but always disabled and not just in arena
  commands:
    - bukkit

command-drops: # https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
   #in the future this will support mythic mobs I'm just not sure if we're really gonna pivot in that position
  'ALL': # every mob drop, these will always be added to the pool.
     '1':
       max-chance: 1000 # 1 in 1000
       chance: 1
       award-message: '&f&lNORMAL FIND!&7 A mob has dropped a common key!'
       commands:
         - crate key give %player_name% common 1
     '2':
       max-chance: 2000 # 1 in 2000
       chance: 1
       award-message: '&a&lUNCOMMON FIND!&7 A mob has dropped an uncommon key!'
       commands:
         - crate key give %player_name% uncommon 1
     '3':
       max-chance: 3500 # 1 in 3500
       chance: 1
       award-message: '&b&lRARE FIND!&7 A mob has dropped a rare key!'
       commands:
         - crate key give %player_name% rare 1
     '4':
       max-chance: 10000 # 1 in 10000
       chance: 1
       award-message: '&6&lLEGENDARY FIND!&7 A mob has dropped an legendary key!'
       commands:
         - crate key give %player_name% legendary 1
  'WARDEN': # mob specific drops 
    '1': # Each section has a chance. It will trigger based on higher number down to the lowest number, and evaluate chance for each. If nothing is resolved, it will do nothing.
      chance: 5
      award-message: '&b&lRARE FIND!&7 You have recieved a &bWarden Chest&7 from killing a warden!'
      commands:
        - 'pf givepfitem %player_name% WardenBox 1'
    '2':
      chance: 10
      award-message: '&a&lUNCOMMON FIND!&7 You have recieved a &fUnlock Scroll&7 from killing a warden!'
      commands:
        - 'pf givepfitem %player_name% UnlockScroll 1'
    '3':
      chance: 20
      award-message: '&f&lNORMAL FIND!&7 You have recieved a &6Rename Tag&7 from killing a warden!'
      commands:
        - 'ae giveitem %player_name% renametag 1'
    '4':
      chance: 20
      award-message: '&f&lNORMAL FIND!&7 You have recieved a &fBlack Scroll&7 from killing a warden!'
      commands:
        - 'ae giveitem %player_name% blackscroll 1 %rng_0,100% %rng_0,100%'
  'IRON_GOLEM':
    '1': # Each section has a chance. It will trigger based on higher number down to the lowest number, and evaluate chance for each. If nothing is resolved, it will do nothing.
      max-chance: 750 # 1 in 750
      chance: 1
      award-message: '&b&lRARE FIND!&7 You have recieved a &fIron Golem Chest&7 from killing an iron golem!'
      commands:
        - 'pf givepfitem %player_name% IronGolemBox 1'
  'ALL_MOB':
    '1':
      max-chance: 500 # 1 in 500
      chance: 1
      award-message: '&6&lLEGENDARY FIND!&7 You have recieved a &2Mob Chest&7 from killing a mob!'
      commands:
        - 'pf givepfitem %player_name% MobLootbox 1'
  'ENDER_DRAGON':
    '1': # Each section has a chance. It will trigger based on higher number down to the lowest number, and evaluate chance for each. If nothing is resolved, it will do nothing.
      chance: 5
      award-message: '&6&lLEGENDARY FIND!&7 You have recieved a &5Ender Dragon Chest&7 from killing an ender dragon!'
      commands:
        - 'pf givepfitem %player_name% EnderDragonLootbox 1'
ae:
   locked:
      locked_message: "&7(&c&l!&7) &c&lHey!&r &7This item is &c&llocked!&r&7 You cannot &a&ladd&r&7 or &4&lremove&r&7 enchants."
      locked_lore_line: "&c&l*** LOCKED ***" #WARNING: Changing this will invalidate all locked items currently owned.
   sealed:
      sealed_lore_line: "&f&l*** SEALED ***" #WARNING: Changing this will invalidate all sealed items currently owned.
drop-confirm:
   enabled: true
   enabled-by-default: false
   worlds: 
     - 'Spawn'
     - 'world'
     - 'world_nether'
     - 'world_the_end'
     - 'Resource'
silk-spawner:
   enabled: false
arena:
  arena-award: 
    '1':
      type: 'money' # money, xp, item
      amount: 200
    '2':
      type: 'item' # money, xp, item
      killstreak: 10 # player killstreak
      material: 'DIAMOND' # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
      item-name: '&d&lTest Award'
      glowing: true
      enchants: # AE enchants work here
       - sharpness:10
      lore:
        - ''
        - '&d&oThis.. strange diamond was never meant to be' 
        - '&d&oheld by human hands.'
  arena-blacklist-message: "&7(&c&l!&7) &c&lHey!&r &7You cannot use this command while in the &cArena&7!"
  arena-blacklist-commands:
    - /spawn
    - /home
    - /cmi:spawn
    - /cmi:home
    - /warp
    - /cmi:warp
    - /cmi:tpa
    - /tpa
    - /tpaccept
    - /cmi:tpaccept